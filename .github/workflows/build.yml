name: build

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Robolectric android-all jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Forbid host-dependent rounding in the engine
        run: |
          if grep -rnE "\bMath\.round\(|\broundToInt\b|\broundToLong\b" core/src/main; then
            echo "Use DartMath.round / Astronomical.javaRound instead." >&2
            exit 1
          fi

      - name: Build and test
        run: ./gradlew build --stacktrace
